[package]
name = "genicam_streamer"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = { version = "0.7", features = ["ws"] }
bytes = "1"
genicam_zenoh_api = { path = "../genicam_zenoh_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "sync", "time"] }
tracing = "0.1"
zenoh = "1"
thiserror = "1"
