[workspace]
resolver = "2"

members = [
  "crates/genicam_xml_model",
  "crates/genicam_xml_model_wasm",
  "crates/genicam_zenoh_api",
  "apps/genicam-ws-streamer",
]

# Keep Tauri app(s) out of the Rust workspace. They are built via `cargo tauri`.
exclude = [
  "apps/genicam-studio-tauri/src-tauri",
]
