[package]
name = "genicam_studio_tauri"
version = "0.1.0"
description = "GenICam Studio desktop app"
edition = "2024"
build = "build.rs"

[dependencies]
# Tauri v2.
# Frontend JS bindings live in `@tauri-apps/api` (also v2); keep both in sync.
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
bytes = "1"
dirs = "6"
genicam_streamer = { path = "../../../crates/genicam_streamer" }
genicam_xml_model = { path = "../../../crates/genicam_xml_model" }
genicam_zenoh_api = { path = "../../../crates/genicam_zenoh_api" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["sync", "time", "net"] }
tracing = "0.1"
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
zenoh = "1"

[build-dependencies]
tauri-build = { version = "2", features = [] }
