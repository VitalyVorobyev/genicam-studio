name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM adapter
        run: ./scripts/wasm-build.sh

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: UI install
        run: bun install --frozen-lockfile
        working-directory: ui/genicam-studio-ui

      - name: UI build
        run: bun run build
        working-directory: ui/genicam-studio-ui

  # E2E-06: End-to-end tests with aravis fake camera + genicam-service
  e2e-tests:
    runs-on: ubuntu-latest
    needs: build
    # Only run on main branch or when explicitly triggered
    if: github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout studio
        uses: actions/checkout@v4

      - name: Checkout genicam-rs
        uses: actions/checkout@v4
        with:
          repository: ${{ github.repository_owner }}/genicam-rs
          path: genicam-rs
          ref: phase2_dev

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
            genicam-rs/target
          key: ${{ runner.os }}-e2e-${{ hashFiles('**/Cargo.lock') }}

      # Install aravis from source (not in standard Ubuntu repos)
      - name: Install aravis build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y meson ninja-build libxml2-dev libglib2.0-dev

      - name: Cache aravis build
        uses: actions/cache@v4
        with:
          path: /tmp/aravis
          key: ${{ runner.os }}-aravis-0.8.33

      - name: Build aravis
        run: |
          if [ ! -f /tmp/aravis/build/src/arv-fake-gv-camera-0.8 ]; then
            git clone --depth 1 --branch ARAVIS_0_8_33 https://github.com/AravisProject/aravis.git /tmp/aravis
            cd /tmp/aravis
            meson setup build -Dviewer=disabled -Dgst-plugin=disabled -Dusb=disabled
            ninja -C build
          fi
          sudo ninja -C /tmp/aravis/build install
          sudo ldconfig

      - name: Build genicam-service
        run: cargo build -p genicam-service --manifest-path genicam-rs/Cargo.toml

      - name: Run E2E tests
        env:
          GENICAM_SERVICE_PATH: genicam-rs/target/debug/genicam-service
        run: cargo test -p e2e-tests -- --ignored --test-threads=1

  # E2E-07: Verify Tauri desktop app builds
  tauri-build:
    runs-on: ${{ matrix.os }}
    needs: build
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system deps (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM adapter
        run: ./scripts/wasm-build.sh

      - name: UI install + build
        run: bun install && bun run build
        working-directory: ui/genicam-studio-ui

      - name: Install Tauri CLI
        run: cargo install tauri-cli --version '^2' --locked

      - name: Build Tauri app
        run: cargo tauri build
        working-directory: apps/genicam-studio-tauri
