name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Rust fmt
        run: cargo fmt --check

      - name: Rust clippy
        run: cargo clippy --all-targets --all-features -- -D warnings

      - name: Rust tests
        run: cargo test

      - name: Set up wasm-pack
        uses: jetli/wasm-pack-action@v0.4.0

      - name: Build WASM adapter
        run: ./scripts/wasm-build.sh

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: ui/genicam-studio-ui/package-lock.json

      - name: UI install
        run: npm ci
        working-directory: ui/genicam-studio-ui

      - name: UI build
        run: npm run build
        working-directory: ui/genicam-studio-ui
